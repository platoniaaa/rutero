name: Publicar en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No cancela el que ya está corriendo: dejar el sitio
# a medio publicar es peor que esperar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construir el export estático
        run: npm run build
        env:
          # El sitio cuelga de /rutero, no de la raíz del dominio.
          NEXT_PUBLIC_BASE_PATH: /rutero

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
